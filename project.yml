# XcodeGen spec. Run `xcodegen generate` to produce Cellect.xcodeproj.
# https://github.com/yonaskolb/XcodeGen
name: Cellect
options:
  bundleIdPrefix: com.cellect
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: D8S2C772KG
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Cellect:
    type: application
    platform: iOS
    sources:
      - path: Cellect
        excludes:
          - Features/CameraCount/CoreMLCellCounter.swift.dataless-backup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.einarolafsson.cellect
        INFOPLIST_FILE: Cellect/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"    # iPhone + iPad
        SUPPORTS_MACCATALYST: NO
    # Google Drive / other SPM deps get added here later, e.g.:
    # dependencies:
    #   - package: GoogleSignIn

  CellectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CellectTests
    dependencies:
      - target: Cellect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.einarolafsson.cellect.tests
